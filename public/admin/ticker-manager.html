<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>动态消息管理 · FOOTRADAPRO 后台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="/js/core/config.js"></script>
    <script src="/js/core/timezone.js"></script>
    <script src="/js/admin/admin_auth_guard.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --primary-light: #60A5FA;
            --secondary: #8B5CF6;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --info: #06B6D4;
            --dark-bg: #0A0F1C;
            --card-bg: rgba(18, 28, 44, 0.75);
            --border-glow: rgba(59, 130, 246, 0.25);
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0B1120, #050814);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #1E293B; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .admin-layout { display: flex; min-height: 100vh; }
        .admin-sidebar {
            width: 280px;
            background: rgba(10, 18, 32, 0.85);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 20;
        }
        .admin-sidebar-logo {
            padding: 28px 24px;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 20px;
        }
        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0 16px 20px 16px;
        }
        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .admin-nav-item i { width: 24px; font-size: 1.2rem; }
        .admin-nav-item:hover { background: rgba(59, 130, 246, 0.15); color: white; transform: translateX(4px); }
        .admin-nav-item.active {
            background: linear-gradient(95deg, rgba(59,130,246,0.2), rgba(139,92,246,0.1));
            color: white;
            border-left: 3px solid var(--primary);
        }

        .admin-main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }
        .admin-header {
            background: rgba(10, 18, 32, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 15;
        }
        .admin-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(120deg, #F1F5F9, var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .admin-header h1 i { color: var(--primary); margin-right: 12px; }
        .admin-user {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255,255,255,0.04);
            padding: 6px 18px;
            border-radius: 60px;
        }
        #adminName { font-weight: 600; color: var(--text-primary); }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .admin-content { padding: 28px 32px; max-width: 1600px; width: 100%; margin: 0 auto; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid var(--border-glow);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); border-color: rgba(59,130,246,0.5); }
        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .stat-icon.blue { background: linear-gradient(145deg, #1E3A8A, #2563EB); }
        .stat-icon.green { background: linear-gradient(145deg, #14532D, #16A34A); }
        .stat-icon.orange { background: linear-gradient(145deg, #9A3412, #EA580C); }
        .stat-icon.purple { background: linear-gradient(145deg, #4C1D95, #8B5CF6); }
        .stat-info { flex: 1; }
        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .stat-value { font-size: 1.8rem; font-weight: 800; color: white; line-height: 1.2; margin-top: 4px; }

        .editor-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            border: 1px solid var(--border-glow);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 24px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-glow);
        }
        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .card-icon.virtual { background: rgba(139, 92, 246, 0.2); color: #A78BFA; }
        .card-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
        .card-desc { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        .card-body { padding: 24px; }

        .param-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .param-item { flex: 1; min-width: 140px; }
        .param-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .param-item input, .filter-select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            font-size: 0.85rem;
        }
        .range-group { display: flex; align-items: center; gap: 8px; }
        .range-group input { width: 100px; }

        .match-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px;
            margin: 16px 0;
            max-height: 280px;
            overflow-y: auto;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 14px;
        }
        .match-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .match-checkbox:hover { border-color: var(--primary); }

        .btn-primary, .btn-secondary, .btn-success {
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3); }
        .btn-success {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
        }
        .btn-success:hover { transform: translateY(-2px); }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
        }
        .btn-secondary:hover { background: rgba(59,130,246,0.15); color: white; border-color: var(--primary); }

        .auto-generate-control {
            background: rgba(0,0,0,0.2);
            border-radius: 14px;
            padding: 16px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .preview-section {
            background: rgba(0,0,0,0.2);
            border-radius: 14px;
            margin-top: 20px;
            overflow: hidden;
        }
        .preview-header {
            padding: 14px 16px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .preview-content {
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
        }
        .preview-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .table-wrapper {
            background: rgba(0,0,0,0.2);
            border-radius: 14px;
            overflow-x: auto;
            margin-bottom: 16px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .data-table th {
            padding: 12px 16px;
            text-align: left;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 1px solid var(--border-glow);
        }
        .data-table td {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
        }
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
        }
        .action-btn:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-glow);
        }
        .tab-btn {
            padding: 10px 24px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .page-btn.active { background: var(--primary); color: white; }

        .badge {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .loading-cell { text-align: center; padding: 48px; color: var(--text-secondary); }
        .empty-cell { text-align: center; padding: 48px; color: var(--text-secondary); }
        .text-success { color: var(--success); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .admin-layout { flex-direction: column; }
            .admin-sidebar { width: 100%; height: auto; position: relative; }
            .admin-nav { flex-direction: row; flex-wrap: wrap; }
            .admin-content { padding: 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .param-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="sidebar-container"></aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1><i class="fas fa-ticket-alt"></i> 动态消息管理</h1>
                <div class="admin-user">
                    <span id="adminName">管理员</span>
                    <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </header>

            <div class="admin-content">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-database"></i></div><div class="stat-info"><div class="stat-value" id="totalCount">0</div><div class="stat-label">总消息数</div></div></div>
                    <div class="stat-card"><div class="stat-icon green"><i class="fas fa-bolt"></i></div><div class="stat-info"><div class="stat-value" id="authCount">0</div><div class="stat-label">授权记录</div></div></div>
                    <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-coins"></i></div><div class="stat-info"><div class="stat-value" id="profitCount">0</div><div class="stat-label">收益记录</div></div></div>
                    <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-chart-line"></i></div><div class="stat-info"><div class="stat-value" id="todayGeneratedCount">0</div><div class="stat-label">今日生成</div></div></div>
                </div>

                <div class="editor-card">
                    <div class="card-header"><div class="card-icon virtual"><i class="fas fa-dice-d6"></i></div><div><div class="card-title">🎲 批量生成消息</div><div class="card-desc">生成英文动态消息，发布后自动存入数据库</div></div></div>
                    <div class="card-body">
                        <div class="param-row">
                            <div class="param-item"><div class="param-label">生成数量</div><input type="number" id="batchCount" value="100" min="1" max="5000" step="10"></div>
                            <div class="param-item"><div class="param-label">授权消息比例 (%)</div><input type="number" id="batchAuthRatio" value="55" min="0" max="100"></div>
                        </div>
                        <div class="param-row">
                            <div class="param-item"><div class="param-label">授权金额范围 (USDT)</div><div class="range-group"><input type="number" id="batchAuthMin" value="100"><span>-</span><input type="number" id="batchAuthMax" value="50000"></div></div>
                            <div class="param-item"><div class="param-label">收益金额范围 (USDT)</div><div class="range-group"><input type="number" id="batchProfitMin" value="50"><span>-</span><input type="number" id="batchProfitMax" value="25000"></div></div>
                            <div class="param-item"><div class="param-label">收益率范围 (%)</div><div class="range-group"><input type="number" id="batchRateMin" value="15"><span>-</span><input type="number" id="batchRateMax" value="350"></div></div>
                        </div>

                        <div class="param-label">选择比赛（不选则使用全部）</div>
                        <div class="match-selector" id="matchSelector"><div class="loading-cell">加载中...</div></div>

                        <div class="auto-generate-control">
                            <div class="status"><i class="fas fa-play-circle" style="font-size: 20px; color: var(--primary);"></i><span>批量生成器</span></div>
                            <div><button class="btn-primary" id="previewBtn"><i class="fas fa-eye"></i> 预览消息</button><button class="btn-success" id="publishBtn" style="margin-left: 8px;"><i class="fas fa-cloud-upload-alt"></i> 一键发布</button></div>
                        </div>

                        <div id="previewSection" class="preview-section" style="display: none;">
                            <div class="preview-header"><span><i class="fas fa-list"></i> 消息预览（可勾选）</span><div><button class="btn-secondary" id="selectAllBtn" style="padding: 4px 12px;">全选</button><button class="btn-secondary" id="deselectAllBtn" style="padding: 4px 12px; margin-left: 4px;">取消</button></div></div>
                            <div class="preview-content" id="previewContent"></div>
                            <div class="preview-header"><span>已选择 <span id="selectedCount">0</span> 条</span></div>
                        </div>
                    </div>
                </div>

                <div class="tabs-container">
                    <button class="tab-btn active" data-tab="all"><i class="fas fa-list"></i> 全部消息</button>
                    <button class="tab-btn" data-tab="history"><i class="fas fa-history"></i> 生成历史</button>
                    <button class="tab-btn" data-tab="matches"><i class="fas fa-futbol"></i> 比赛池管理</button>
                </div>

                <div class="tab-pane active" id="allTab">
                    <div class="editor-card">
                        <div class="card-header"><div class="card-icon" style="background: rgba(139,92,246,0.2); color:#A78BFA;"><i class="fas fa-list"></i></div><div><div class="card-title">全部消息</div><div class="card-desc">管理所有动态消息</div></div><button class="btn-secondary" id="clearAllBtn" style="margin-left: auto;"><i class="fas fa-trash"></i> 清空全部</button></div>
                        <div class="card-body">
                            <div class="param-row">
                                <div class="param-item"><select id="filterType" class="filter-select"><option value="all">全部类型</option><option value="auth">⚡ 授权</option><option value="profit">💰 收益</option><option value="system">📢 系统</option></select></div>
                                <div class="param-item"><input type="text" id="searchMessage" placeholder="搜索消息内容..."></div>
                                <div class="param-item"><button class="btn-secondary" id="refreshMessagesBtn" style="width: 100%;"><i class="fas fa-sync-alt"></i> 刷新</button></div>
                            </div>
                            <div class="table-wrapper"><table class="data-table"><thead><tr><th>类型</th><th>消息内容</th><th>权重</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="allMessagesList"></tbody></table></div>
                            <div class="pagination" id="allMessagesPagination"></div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane" id="historyTab">
                    <div class="editor-card">
                        <div class="card-header"><div class="card-icon" style="background: rgba(16,185,129,0.2); color:#10B981;"><i class="fas fa-history"></i></div><div><div class="card-title">生成历史</div><div class="card-desc">查看所有消息生成记录</div></div><span class="badge" id="todayGeneratedBadge">今日: 0</span></div>
                        <div class="card-body">
                            <div class="table-wrapper"><table class="data-table"><thead><tr><th>时间</th><th>管理员</th><th>生成数量</th><th>授权</th><th>收益</th><th>系统</th></tr></thead><tbody id="historyList"></tbody></table></div>
                            <div class="pagination" id="historyPagination"></div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane" id="matchesTab">
                    <div class="editor-card">
                        <div class="card-header"><div class="card-icon" style="background: rgba(249,115,22,0.2); color:#F97316;"><i class="fas fa-futbol"></i></div><div><div class="card-title">比赛数据池</div><div class="card-desc">从比赛管理系统同步（只读）</div></div><button class="btn-success" id="goToMatchesManageBtn" style="margin-left: auto;"><i class="fas fa-external-link-alt"></i> 前往比赛管理</button></div>
                        <div class="card-body">
                            <div class="table-wrapper"><table class="data-table"><thead><tr><th>ID</th><th>联赛</th><th>主队</th><th>客队</th><th>比赛时间</th><th>状态</th><th>执行率</th><th>前台显示</th></tr></thead><tbody id="matchesList"></tbody></table></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        (function() {
            'use strict';

            const UTILS = {
                formatNumber: (num) => Number(num || 0).toLocaleString('en-US'),
                formatDateTime: (dateStr) => {
                    if (!dateStr) return '-';
                    try {
                        const d = new Date(dateStr);
                        if (isNaN(d.getTime())) return '-';
                        return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                    } catch(e) { return '-'; }
                },
                formatMatchTime: (dateStr) => {
                    if (!dateStr) return '-';
                    try {
                        const d = new Date(dateStr);
                        if (isNaN(d.getTime())) return '-';
                        return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                    } catch(e) { return '-'; }
                },
                escapeHtml: (str) => {
                    if (!str) return '';
                    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
                },
                maskUserId: (userId) => {
                    if (!userId || userId.length < 5) return userId;
                    return userId.substring(0, 2) + '***' + userId.substring(userId.length - 3);
                },
                generateUserId: () => {
                    const digits = Math.floor(Math.random() * 1000000000).toString().padStart(9, '0');
                    const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
                    return `U${digits}${letters[Math.floor(Math.random() * letters.length)]}`;
                },
                showToast: (msg, type = 'success') => {
                    const toast = document.createElement('div');
                    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;

            async function generateRealMessages(params, matches) {
                const messages = [];
                const totalCount = Math.min(params.count, 500);
                const systemCount = Math.floor(totalCount * 0.1);
                const userCount = totalCount - systemCount;
                const authTargetCount = Math.floor(userCount * params.authRatio / 100);
                const profitTargetCount = userCount - authTargetCount;
                
                const random = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
                const formatAmount = (num) => num.toLocaleString('en-US');
                
                const systemTemplates = [
                    `🎉 Total volume exceeds ${formatAmount(random(1000000, 10000000))} USDT`,
                    `⚡ Last 24h volume ${formatAmount(random(50000, 500000))} USDT`,
                    `💰 Yesterday profit ${formatAmount(random(10000, 100000))} USDT`,
                    `👥 Active users ${formatAmount(random(5000, 50000))}`,
                    `🔥 New record: ${formatAmount(random(200000, 2000000))} USDT in 24h`,
                    `📊 Weekly report: +${random(5, 45)}% growth`,
                    `🏆 Top trader earned ${formatAmount(random(50000, 500000))} USDT`
                ];
                
                for (let i = 0; i < systemCount && i < systemTemplates.length; i++) {
                    messages.push({ type: 'system', message: systemTemplates[i % systemTemplates.length] });
                }
                
                if (matches.length === 0) {
                    for (let i = messages.length; i < totalCount; i++) {
                        messages.push({ type: 'system', message: systemTemplates[i % systemTemplates.length] });
                    }
                    for (let i = messages.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [messages[i], messages[j]] = [messages[j], messages[i]];
                    }
                    return messages;
                }
                
                for (let i = 0; i < authTargetCount; i++) {
                    const match = matches[Math.floor(Math.random() * matches.length)];
                    const authAmount = random(params.authMin, params.authMax);
                    messages.push({
                        type: 'auth',
                        message: `⚡ User ${UTILS.maskUserId(UTILS.generateUserId())} authorized ${formatAmount(authAmount)} USDT on [${match.home_team} vs ${match.away_team}]`
                    });
                }
                
                for (let i = 0; i < profitTargetCount; i++) {
                    const match = matches[Math.floor(Math.random() * matches.length)];
                    const profitAmount = random(params.profitMin, params.profitMax);
                    const profitRate = random(params.profitRateMin, params.profitRateMax);
                    messages.push({
                        type: 'profit',
                        message: `💰 User ${UTILS.maskUserId(UTILS.generateUserId())} earned ${formatAmount(profitAmount)} USDT (+${profitRate}%) from [${match.home_team} vs ${match.away_team}]`
                    });
                }
                
                for (let i = messages.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [messages[i], messages[j]] = [messages[j], messages[i]];
                }
                
                return messages;
            }

async function publishMessages() {
    const checkboxes = document.querySelectorAll('.preview-checkbox:checked');
    if (checkboxes.length === 0) {
        UTILS.showToast('请至少选择一条消息', 'error');
        return;
    }
    
    // 获取选中的比赛数据
    let selectedMatches = Array.from(document.querySelectorAll('#matchSelector .match-checkbox-item:checked')).map(cb => ({
        id: cb.value,
        name: cb.dataset.name,
        home_team: cb.dataset.home,
        away_team: cb.dataset.away
    }));
    
    if (selectedMatches.length === 0) {
        const allMatches = await getAvailableMatchesForMessages();
        selectedMatches = allMatches.map(m => ({
            id: m.id,
            name: `${m.home_team} vs ${m.away_team}`,
            home_team: m.home_team,
            away_team: m.away_team
        }));
    }
    
    if (selectedMatches.length === 0) {
        UTILS.showToast('没有可用的比赛数据，请先在比赛管理中添加比赛', 'error');
        return;
    }
    
    const selectedMessages = [];
    checkboxes.forEach(cb => {
        const idx = parseInt(cb.dataset.index);
        if (currentPreviewMessages[idx]) {
            selectedMessages.push(currentPreviewMessages[idx]);
        }
    });
    
    if (selectedMessages.length === 0) {
        UTILS.showToast('没有有效的消息', 'error');
        return;
    }
    
    UTILS.showToast(`正在发布 ${selectedMessages.length} 条消息...`);
    
    let successCount = 0;
    let failCount = 0;
    
    // 逐条发布，每条消息关联一个随机比赛
    for (let i = 0; i < selectedMessages.length; i++) {
        const msg = selectedMessages[i];
        const randomMatch = selectedMatches[Math.floor(Math.random() * selectedMatches.length)];
        
        try {
            const response = await fetch('/api/v1/admin/ticker-manager/batch-generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    messages: [msg],
                    match_id: randomMatch.id,
                    match_name: randomMatch.name
                })
            });
            
            const result = await response.json();
            if (response.ok && result.success) {
                successCount++;
            } else {
                failCount++;
                console.error('发布失败:', result);
            }
        } catch (err) {
            failCount++;
            console.error('发布错误:', err);
        }
        
        if ((i + 1) % 5 === 0 || i === selectedMessages.length - 1) {
            UTILS.showToast(`进度: ${i + 1}/${selectedMessages.length} (成功: ${successCount}, 失败: ${failCount})`);
        }
    }
    
    if (successCount > 0) {
        UTILS.showToast(`成功发布 ${successCount} 条消息，失败 ${failCount} 条`);
        document.getElementById('previewSection').style.display = 'none';
        await loadAllMessages();
        await loadGenerationHistory();
        await updateStats();
        currentPreviewMessages = [];
    } else {
        UTILS.showToast('发布失败，请检查比赛数据', 'error');
    }
}

                });
                
                document.getElementById('logoutBtn')?.addEventListener('click', () => {
                    localStorage.removeItem('admin_token');
                    localStorage.removeItem('admin_name');
                    window.location.href = '/admin/index.html';
                });
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
