<!-- 
  authorizations-content.html - 我的授权记录内容片段
  用于 SPA 架构，通过 shell.html 的 #app-content 区域加载
-->

<div class="authorizations-container">
  <!-- 模式指示器 -->
  <div class="mode-indicator">
    <i class="fa-solid fa-info-circle"></i>
    <span>Current Mode: </span>
    <span id="currentModeText" class="sandbox-mode-text">Sandbox</span>
  </div>

  <!-- 筛选标签 -->
  <div class="filter-tabs">
    <button class="filter-tab active" data-status="all">All</button>
    <button class="filter-tab" data-status="pending">Active</button>
    <button class="filter-tab" data-status="settled">History</button>
  </div>

  <!-- 统计卡片 -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-number" id="pendingCount">0</div>
      <div class="stat-label">Active</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="winCount">0</div>
      <div class="stat-label">Won</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="lossCount">0</div>
      <div class="stat-label">Loss</div>
    </div>
  </div>

  <!-- 加载状态 -->
  <div id="loadingState" class="loading-state">
    <div class="loading-spinner"></div>
    <p>Loading authorizations...</p>
  </div>

  <!-- 空状态 -->
  <div id="emptyState" class="empty-state" style="display: none;">
    <i class="fa-solid fa-futbol"></i>
    <p>No authorizations found</p>
  </div>

  <!-- 授权列表容器 -->
  <div id="listContainer" class="auth-list"></div>

  <!-- 加载更多 -->
  <div id="loadMore" class="load-more" style="display: none;">
    <button class="load-more-btn" id="loadMoreBtn">Load More</button>
  </div>
</div>

<style>
  .authorizations-container {
    max-width: 900px;
    margin: 0 auto;
    padding: var(--space-6);
    width: 100%;
  }

  .mode-indicator {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    background: var(--badge-soft);
    backdrop-filter: blur(8px);
    padding: 6px 16px;
    border-radius: var(--radius-full);
    width: fit-content;
    margin-bottom: var(--space-5);
    font-size: var(--font-sm);
  }
  .mode-indicator .sandbox-mode-text { color: #8b5cf6; font-weight: 600; }
  .mode-indicator .live-mode-text { color: #f97316; font-weight: 600; }

  .filter-tabs {
    display: flex;
    gap: var(--space-2);
    margin-bottom: var(--space-6);
    flex-wrap: wrap;
  }
  .filter-tab {
    background: var(--badge-soft);
    border: none;
    padding: 10px 24px;
    border-radius: var(--radius-full);
    color: var(--text-secondary);
    font-weight: 600;
    cursor: pointer;
    transition: all var(--duration-fast);
    font-size: var(--font-sm);
  }
  .filter-tab.active {
    background: var(--accent-gradient);
    color: white;
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  .stats-row {
    display: flex;
    gap: var(--space-4);
    margin-bottom: var(--space-6);
  }
  .stat-card {
    flex: 1;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    border-radius: var(--radius-lg);
    border: 1px solid var(--glass-border);
    padding: var(--space-4) var(--space-3);
    text-align: center;
    transition: all var(--duration-fast);
  }
  .stat-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .stat-number {
    font-size: var(--font-xl);
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }
  .stat-label {
    font-size: var(--font-xs);
    color: var(--text-muted);
    margin-top: var(--space-1);
  }

  .auth-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  .auth-card {
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    border-radius: var(--radius-xl);
    border: 1px solid var(--glass-border);
    padding: var(--space-5);
    cursor: pointer;
    transition: all var(--duration-base);
  }
  .auth-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: var(--glass-shadow-hover);
  }

  .auth-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-4);
  }
  .auth-league {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--font-xs);
    color: var(--text-muted);
  }
  .auth-status {
    font-size: var(--font-xs);
    font-weight: 600;
    padding: 4px 12px;
    border-radius: var(--radius-full);
  }
  .auth-status.active { background: rgba(249,115,22,0.15); color: #f97316; }
  .auth-status.won { background: rgba(16,185,129,0.15); color: #10b981; }
  .auth-status.loss { background: rgba(239,68,68,0.15); color: #ef4444; }

  .auth-teams {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-4);
  }
  .team-with-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    flex: 1;
  }
  .team-logo-circle {
    width: 56px;
    height: 56px;
    background: var(--badge-soft);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--glass-border);
  }
  .team-logo-circle i {
    font-size: 28px;
    color: var(--accent);
  }
  .team-name {
    font-weight: 600;
    font-size: var(--font-sm);
    text-align: center;
  }
  .team-abbr {
    font-size: var(--font-xs);
    color: var(--text-muted);
  }
  .vs-badge {
    font-weight: 700;
    color: var(--accent);
    background: var(--badge-soft);
    padding: 4px 12px;
    border-radius: var(--radius-full);
    font-size: var(--font-xs);
  }

  .auth-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: var(--space-4);
    padding-top: var(--space-4);
    border-top: 1px solid var(--border-light);
  }
  .auth-amount {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--font-sm);
    font-weight: 600;
  }
  .auth-profit {
    font-size: var(--font-sm);
    font-weight: 600;
  }
  .auth-profit.positive { color: var(--success); }
  .auth-profit.negative { color: var(--danger); }
  .auth-profit.pending { color: var(--warning); }
  .auth-time {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    font-size: var(--font-xs);
    color: var(--text-muted);
    margin-top: var(--space-3);
  }

  .loading-state {
    text-align: center;
    padding: 60px;
  }
  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 3px solid var(--border-light);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 60px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border-radius: var(--radius-2xl);
  }
  .empty-state i {
    font-size: 64px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .load-more {
    display: flex;
    justify-content: center;
    margin: var(--space-6) 0;
  }
  .load-more-btn {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    padding: 12px 32px;
    border-radius: var(--radius-full);
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    transition: all var(--duration-fast);
  }
  .load-more-btn:hover {
    background: var(--accent);
    color: white;
  }

  @media (max-width: 768px) {
    .authorizations-container { padding: var(--space-4); }
    .mode-indicator { padding: 4px 14px; font-size: var(--font-xs); margin-bottom: var(--space-4); }
    .filter-tab { padding: 8px 18px; font-size: var(--font-xs); }
    .stats-row { gap: var(--space-3); }
    .stat-card { padding: var(--space-3) var(--space-2); }
    .stat-number { font-size: var(--font-md); }
    .stat-label { font-size: 10px; }
    .auth-card { padding: var(--space-4); border-radius: var(--radius-lg); }
    .team-logo-circle { width: 48px; height: 48px; }
    .team-logo-circle i { font-size: 24px; }
    .team-name { font-size: var(--font-xs); }
    .auth-amount { font-size: var(--font-xs); }
    .auth-profit { font-size: var(--font-xs); }
  }

  @media (max-width: 480px) {
    .authorizations-container { padding: var(--space-3); }
    .stats-row { gap: var(--space-2); }
    .stat-card { padding: var(--space-2); }
    .stat-number { font-size: var(--font-base); }
    .team-logo-circle { width: 40px; height: 40px; }
    .team-logo-circle i { font-size: 20px; }
    .team-name { font-size: 10px; }
    .vs-badge { padding: 2px 8px; font-size: 10px; }
  }
</style>

<script>
(function() {
  'use strict';

  let currentStatus = 'all';
  let items = [];
  let isLoading = false;

  const DOM = {
    loadingState: document.getElementById('loadingState'),
    listContainer: document.getElementById('listContainer'),
    emptyState: document.getElementById('emptyState'),
    loadMore: document.getElementById('loadMore'),
    loadMoreBtn: document.getElementById('loadMoreBtn'),
    pendingCount: document.getElementById('pendingCount'),
    winCount: document.getElementById('winCount'),
    lossCount: document.getElementById('lossCount'),
    currentModeText: document.getElementById('currentModeText'),
    filterTabs: document.querySelectorAll('.filter-tab')
  };

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
  }

  function getCurrencySymbol() {
    if (window.ThemeManager && !window.ThemeManager.isTestMode) {
      return 'USDT';
    }
    return 'tUSDT';
  }

  function formatDate(dateStr) {
    if (!dateStr) return '-';
    try {
      const date = new Date(dateStr);
      return `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
    } catch { return '-'; }
  }

  function getTeamLogoHtml(teamName, logoUrl) {
    if (logoUrl && logoUrl !== '/uploads/teams/default.png' && logoUrl !== '') {
      return `<img src="${logoUrl}" alt="${escapeHtml(teamName)}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fas fa-futbol\'></i>'">`;
    }
    return `<i class="fas fa-futbol"></i>`;
  }

  function renderAuthCard(item) {
    const dateStr = formatDate(item.created_at);
    const isPending = item.status === 'pending';
    const isWin = parseFloat(item.profit) > 0;
    // ✅ 修复：使用 Number() 转换 profit
    const profitNum = Number(item.profit) || 0;
    const profitClass = isPending ? 'pending' : (isWin ? 'positive' : 'negative');
    const profitText = isPending ? 'Pending' : (isWin ? `+${profitNum.toFixed(2)}` : `${profitNum.toFixed(2)}`);
    const statusClass = isPending ? 'active' : (isWin ? 'won' : 'loss');
    const statusText = isPending ? 'Active' : (isWin ? 'Won' : 'Loss');
    const currency = getCurrencySymbol();

    return `
      <div class="auth-card" onclick="window.location.href='/shell.html?page=transaction-detail&authId=${item.auth_id}'">
        <div class="auth-header">
          <div class="auth-league"><i class="fas fa-trophy"></i> ${escapeHtml(item.league)}</div>
          <div class="auth-status ${statusClass}">${statusText}</div>
        </div>
        <div class="auth-teams">
          <div class="team-with-logo">
            <div class="team-logo-circle">${getTeamLogoHtml(item.home_team, item.home_logo)}</div>
            <div class="team-name">${escapeHtml(item.home_team)}</div>
            <div class="team-abbr">${escapeHtml(item.home_team.substring(0, 3).toUpperCase())}</div>
          </div>
          <div class="vs-badge">VS</div>
          <div class="team-with-logo">
            <div class="team-logo-circle">${getTeamLogoHtml(item.away_team, item.away_logo)}</div>
            <div class="team-name">${escapeHtml(item.away_team)}</div>
            <div class="team-abbr">${escapeHtml(item.away_team.substring(0, 3).toUpperCase())}</div>
          </div>
        </div>
        <div class="auth-footer">
          <div class="auth-amount"><i class="fas fa-coins"></i> ${item.amount} ${currency}</div>
          <div class="auth-profit ${profitClass}">${profitText}</div>
        </div>
        <div class="auth-time"><i class="far fa-clock"></i> ${dateStr}</div>
      </div>
    `;
  }

  function renderList() {
    if (!DOM.listContainer) return;
    
    let filtered = items;
    if (currentStatus === 'pending') {
      filtered = items.filter(i => i.status === 'pending');
    } else if (currentStatus === 'settled') {
      filtered = items.filter(i => i.status === 'won' || i.status === 'lost');
    }

    const pendingCount = items.filter(i => i.status === 'pending').length;
    const winCount = items.filter(i => (i.status === 'won') && parseFloat(i.profit) > 0).length;
    const lossCount = items.filter(i => (i.status === 'lost') && parseFloat(i.profit) < 0).length;

    if (DOM.pendingCount) DOM.pendingCount.textContent = pendingCount;
    if (DOM.winCount) DOM.winCount.textContent = winCount;
    if (DOM.lossCount) DOM.lossCount.textContent = lossCount;

    if (filtered.length === 0) {
      DOM.listContainer.innerHTML = '';
      if (DOM.emptyState) DOM.emptyState.style.display = 'block';
      if (DOM.loadMore) DOM.loadMore.style.display = 'none';
    } else {
      if (DOM.emptyState) DOM.emptyState.style.display = 'none';
      DOM.listContainer.innerHTML = filtered.map(item => renderAuthCard(item)).join('');
      if (DOM.loadMore) DOM.loadMore.style.display = 'none';
    }
  }

  function switchTab(status) {
    currentStatus = status;
    DOM.filterTabs.forEach(tab => {
      if (tab.dataset.status === status) {
        tab.classList.add('active');
      } else {
        tab.classList.remove('active');
      }
    });
    renderList();
  }

  function updateModeUI() {
    if (!DOM.currentModeText) return;
    const isSandbox = window.ThemeManager ? window.ThemeManager.isTestMode : true;
    DOM.currentModeText.textContent = isSandbox ? 'Sandbox' : 'Live';
    DOM.currentModeText.className = isSandbox ? 'sandbox-mode-text' : 'live-mode-text';
    renderList();
  }

  async function fetchAuthorizations() {
    try {
      const isSandbox = window.ThemeManager ? window.ThemeManager.isTestMode : true;
      const response = await fetch('/api/v1/user/authorize/list?limit=100', {
        credentials: 'include',
        cache: 'no-cache'
      });
      const result = await response.json();
      
      if (result.success && result.data) {
        items = result.data.map(auth => ({
          id: auth.id,
          auth_id: auth.auth_id,
          home_team: auth.home_team || 'Unknown',
          away_team: auth.away_team || 'Unknown',
          home_logo: auth.home_logo || null,
          away_logo: auth.away_logo || null,
          league: auth.league || 'Football',
          amount: auth.amount,
          profit: auth.profit,
          status: auth.status,
          created_at: auth.created_at
        }));
        return true;
      }
      return false;
    } catch (error) {
      console.error('获取授权记录失败:', error);
      return false;
    }
  }

  async function refreshData() {
    if (isLoading) return;
    isLoading = true;
    if (DOM.loadingState) DOM.loadingState.style.display = 'block';
    
    await fetchAuthorizations();
    renderList();
    
    if (DOM.loadingState) DOM.loadingState.style.display = 'none';
    isLoading = false;
  }

  function bindEvents() {
    DOM.filterTabs.forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.status));
    });
  }

  function initModeListener() {
    if (window.ThemeManager) {
      ThemeManager.addListener(async (state) => {
        console.log('🔄 Records: Mode changed to', state.isTestMode ? 'Sandbox' : 'Live');
        updateModeUI();
        await refreshData();
      });
    }
  }

  async function init() {
    console.log('📋 Authorizations page initialized');
    bindEvents();
    initModeListener();
    updateModeUI();
    await refreshData();
  }

  init();
})();
</script>
