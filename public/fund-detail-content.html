<!-- 
  fund-detail-content.html - Fund Detail Content Fragment
  Description: Display user fund records (deposits, withdrawals, authorizations)
  i18n Ready: All text wrapped with data-i18n attributes for future multi-language support
  Version: 2.0.0 - Full English default, i18n ready
-->

<div class="fund-detail-container">

  <!-- Mode Indicator -->
  <div class="mode-indicator">
    <i class="fa-solid fa-info-circle"></i>
    <span data-i18n="fund.mode">Current Mode: </span>
    <span id="currentModeText" class="sandbox-mode-text">Sandbox</span>
    <span id="testModeBadge" class="test-badge-mode" style="display: none;"><i class="fa-solid fa-flask"></i> <span data-i18n="fund.testMode">Test Mode</span></span>
  </div>

  <!-- Stats Cards -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-number" id="totalDeposit">0.00</div>
      <div class="stat-label" data-i18n="fund.totalDeposit">Total Deposit</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="totalWithdraw">0.00</div>
      <div class="stat-label" data-i18n="fund.totalWithdraw">Total Withdraw</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="netFund">0.00</div>
      <div class="stat-label" data-i18n="fund.netFund">Net Fund</div>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="filter-tab active" data-type="all" data-i18n="fund.filterAll">All</button>
    <button class="filter-tab" data-type="deposit" data-i18n="fund.filterDeposit">Deposit</button>
    <button class="filter-tab" data-type="withdraw" data-i18n="fund.filterWithdraw">Withdraw</button>
  </div>

  <!-- Loading State -->
  <div id="loadingState" class="loading-state">
    <div class="loading-spinner"></div>
    <p data-i18n="fund.loading">Loading fund records...</p>
  </div>

  <!-- Empty State -->
  <div id="emptyState" class="empty-state" style="display: none;">
    <i class="fa-solid fa-coins"></i>
    <p data-i18n="fund.empty">No fund records found</p>
  </div>

  <!-- Fund List -->
  <div id="fundList" class="fund-list" style="display: none;"></div>

  <!-- Load More -->
  <div id="loadMore" class="load-more" style="display: none;">
    <button class="load-more-btn" id="loadMoreBtn" data-i18n="fund.loadMore">Load More</button>
  </div>
</div>

<style>
  .fund-detail-container {
    max-width: 900px;
    margin: 0 auto;
    padding: var(--space-6);
    width: 100%;
  }

  .mode-indicator {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    background: var(--badge-soft);
    backdrop-filter: blur(8px);
    padding: 6px 16px;
    border-radius: var(--radius-full);
    width: fit-content;
    margin-bottom: var(--space-5);
    font-size: var(--font-sm);
  }
  .mode-indicator .sandbox-mode-text { color: #8b5cf6; font-weight: 600; }
  .mode-indicator .live-mode-text { color: #f97316; font-weight: 600; }
  .test-badge-mode {
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: white;
    padding: 4px 12px;
    border-radius: var(--radius-full);
    font-size: var(--font-xs);
    margin-left: var(--space-3);
  }

  .stats-row {
    display: flex;
    gap: var(--space-4);
    margin-bottom: var(--space-6);
  }
  .stat-card {
    flex: 1;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    border-radius: var(--radius-lg);
    border: 1px solid var(--glass-border);
    padding: var(--space-4) var(--space-3);
    text-align: center;
    transition: all var(--duration-fast);
  }
  .stat-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .stat-number {
    font-size: var(--font-xl);
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }
  .stat-label {
    font-size: var(--font-xs);
    color: var(--text-muted);
    margin-top: var(--space-1);
  }

  .filter-tabs {
    display: flex;
    gap: var(--space-2);
    margin-bottom: var(--space-6);
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .filter-tab {
    background: var(--badge-soft);
    border: none;
    padding: 10px 24px;
    border-radius: var(--radius-full);
    color: var(--text-secondary);
    font-weight: 600;
    cursor: pointer;
    transition: all var(--duration-fast);
    font-size: var(--font-sm);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .filter-tab.active {
    background: var(--accent-gradient);
    color: white;
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  .fund-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  .fund-item {
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    border-radius: var(--radius-xl);
    border: 1px solid var(--glass-border);
    padding: var(--space-5);
    display: flex;
    align-items: center;
    gap: var(--space-4);
    cursor: pointer;
    transition: all var(--duration-base);
  }
  .fund-item:hover {
    transform: translateX(4px);
    border-color: var(--accent);
    box-shadow: var(--glass-shadow-hover);
  }
  .fund-item.highlight {
    background: var(--accent-gradient);
    border-color: var(--accent);
    animation: highlightPulse 0.5s ease;
  }
  @keyframes highlightPulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 var(--accent-glow); }
    50% { transform: scale(1.01); box-shadow: 0 0 0 4px var(--accent-glow); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 var(--accent-glow); }
  }

  .fund-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .fund-icon.deposit { background: rgba(16,185,129,0.15); color: #10b981; }
  .fund-icon.withdraw { background: rgba(239,68,68,0.15); color: #ef4444; }
  .fund-icon.settlement { background: rgba(59,130,246,0.15); color: #3b82f6; }
  .fund-icon.authorization { background: rgba(139,92,246,0.15); color: #8b5cf6; }
  .fund-icon i { font-size: 20px; }

  .fund-info { flex: 1; }
  .fund-type {
    font-weight: 700;
    font-size: var(--font-base);
    margin-bottom: var(--space-1);
  }
  .fund-type.deposit { color: #10b981; }
  .fund-type.withdraw { color: #ef4444; }
  .fund-type.settlement { color: #3b82f6; }
  .fund-type.authorization { color: #8b5cf6; }
  .fund-desc {
    font-size: var(--font-xs);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: var(--space-1);
    margin-top: var(--space-1);
  }

  .fund-right { text-align: right; flex-shrink: 0; }
  .fund-amount {
    font-weight: 700;
    font-size: var(--font-base);
  }
  .fund-amount.deposit { color: #10b981; }
  .fund-amount.withdraw { color: #ef4444; }
  .fund-amount.settlement { color: #3b82f6; }
  .fund-amount.authorization { color: #8b5cf6; }
  .fund-time {
    font-size: var(--font-xs);
    color: var(--text-muted);
    margin-top: var(--space-1);
  }

  .loading-state { text-align: center; padding: 60px; }
  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 3px solid var(--border-light);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 60px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border-radius: var(--radius-2xl);
  }
  .empty-state i {
    font-size: 64px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .load-more {
    display: flex;
    justify-content: center;
    margin: var(--space-6) 0;
  }
  .load-more-btn {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    padding: 12px 32px;
    border-radius: var(--radius-full);
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    transition: all var(--duration-fast);
  }
  .load-more-btn:hover {
    background: var(--accent);
    color: white;
  }

  @media (max-width: 768px) {
    .fund-detail-container { padding: var(--space-4); }
    .stat-number { font-size: var(--font-md); }
    .fund-item { padding: var(--space-4); gap: var(--space-3); }
    .fund-icon { width: 40px; height: 40px; }
    .fund-icon i { font-size: 16px; }
    .fund-type { font-size: var(--font-sm); }
    .fund-amount { font-size: var(--font-sm); }
  }

  @media (max-width: 480px) {
    .fund-detail-container { padding: var(--space-3); }
    .stats-row { gap: var(--space-2); }
    .stat-card { padding: var(--space-2); }
    .stat-number { font-size: var(--font-base); }
    .fund-item { flex-wrap: wrap; }
    .fund-right { width: 100%; text-align: left; margin-top: var(--space-2); }
  }
</style>

<script>
(function() {
  'use strict';

  // ==================== i18n Configuration ====================
  const FUND_I18N = {
    en: {
      'fund.mode': 'Current Mode: ',
      'fund.testMode': 'Test Mode',
      'fund.totalDeposit': 'Total Deposit',
      'fund.totalWithdraw': 'Total Withdraw',
      'fund.netFund': 'Net Fund',
      'fund.filterAll': 'All',
      'fund.filterDeposit': 'Deposit',
      'fund.filterWithdraw': 'Withdraw',
      'fund.loading': 'Loading fund records...',
      'fund.empty': 'No fund records found',
      'fund.loadMore': 'Load More',
      'fund.typeDeposit': 'Deposit',
      'fund.typeWithdraw': 'Withdraw',
      'fund.typeAuthorization': 'Authorization',
      'fund.typeSettlement': 'Settlement',
      'fund.typeTestDeposit': 'Test Deposit',
      'fund.typeTestWithdraw': 'Test Withdraw',
      'fund.typeIncome': 'Income',
      'fund.typeExpense': 'Expense',
      'fund.statusCompleted': 'Completed',
      'fund.statusProcessing': 'Processing',
      'fund.statusPending': 'Pending',
      'fund.statusFailed': 'Failed',
      'fund.descAuthorization': 'Fund locked for authorization',
      'fund.descSettlement': 'Match settlement',
      'fund.descTestDeposit': 'Test deposit',
      'fund.descTestWithdraw': 'Test withdrawal',
      'fund.descDeposit': 'Deposit credited',
      'fund.descWithdraw': 'Withdrawal'
    },
    zh: {
      'fund.mode': '当前模式: ',
      'fund.testMode': '测试模式',
      'fund.totalDeposit': '总充值',
      'fund.totalWithdraw': '总提现',
      'fund.netFund': '净资金',
      'fund.filterAll': '全部',
      'fund.filterDeposit': '充值',
      'fund.filterWithdraw': '提现',
      'fund.loading': '加载资金记录中...',
      'fund.empty': '暂无资金记录',
      'fund.loadMore': '加载更多',
      'fund.typeDeposit': '充值',
      'fund.typeWithdraw': '提现',
      'fund.typeAuthorization': '授权',
      'fund.typeSettlement': '结算',
      'fund.typeTestDeposit': '测试充值',
      'fund.typeTestWithdraw': '测试提现',
      'fund.typeIncome': '收入',
      'fund.typeExpense': '支出',
      'fund.statusCompleted': '已完成',
      'fund.statusProcessing': '处理中',
      'fund.statusPending': '待处理',
      'fund.statusFailed': '失败',
      'fund.descAuthorization': '授权锁定资金',
      'fund.descSettlement': '比赛结算',
      'fund.descTestDeposit': '测试充值',
      'fund.descTestWithdraw': '测试提现',
      'fund.descDeposit': '充值到账',
      'fund.descWithdraw': '提现'
    }
  };

  let fundLang = localStorage.getItem('language') || 'en';

  function fundT(key) {
    return FUND_I18N[fundLang]?.[key] || FUND_I18N.en[key] || key;
  }

  function updateFundI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      const translation = fundT(key);
      if (translation && translation !== key) {
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
          el.placeholder = translation;
        } else {
          el.textContent = translation;
        }
      }
    });
  }

  window.addEventListener('languagechange', (e) => {
    if (e.detail?.language) {
      fundLang = e.detail.language;
      updateFundI18n();
      renderRecords(currentCurrency, currentIsTestMode);
    }
  });

  const pageSize = 20;
  let currentPage = 1;
  let currentType = 'all';
  let hasMore = false;
  let allRecords = [];
  let currentCurrency = 'USDT';
  let currentIsTestMode = false;

  const urlParams = new URLSearchParams(window.location.search);
  const targetId = urlParams.get('id');

  const DOM = {
    loadingState: document.getElementById('loadingState'),
    fundList: document.getElementById('fundList'),
    emptyState: document.getElementById('emptyState'),
    loadMore: document.getElementById('loadMore'),
    loadMoreBtn: document.getElementById('loadMoreBtn'),
    totalDeposit: document.getElementById('totalDeposit'),
    totalWithdraw: document.getElementById('totalWithdraw'),
    netFund: document.getElementById('netFund'),
    tabBtns: document.querySelectorAll('.filter-tab'),
    currentModeText: document.getElementById('currentModeText'),
    testModeBadge: document.getElementById('testModeBadge')
  };

  function formatDate(dateStr) {
    if (!dateStr) return '-';
    try {
      const date = new Date(dateStr);
      return date.toLocaleString('en-US', {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    } catch { return '-'; }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
  }

  function updateModeUI(isTestMode) {
    if (DOM.currentModeText) {
      DOM.currentModeText.textContent = isTestMode ? 'Sandbox' : 'Live';
      DOM.currentModeText.className = isTestMode ? 'sandbox-mode-text' : 'live-mode-text';
    }
    if (DOM.testModeBadge) {
      DOM.testModeBadge.style.display = isTestMode ? 'inline-flex' : 'none';
    }
  }

  function getTypeDisplayInfo(record, isTestMode) {
    const currency = isTestMode ? 'tUSDT' : 'USDT';
    
    if (isTestMode) {
      switch (record.type) {
        case 'authorize':
          return {
            typeText: fundT('fund.typeAuthorization'),
            icon: 'key',
            amountClass: 'authorization',
            amountPrefix: '-',
            description: fundT('fund.descAuthorization')
          };
        case 'settle':
          const isProfit = record.amount > 0;
          return {
            typeText: fundT('fund.typeSettlement'),
            icon: 'calculator',
            amountClass: 'settlement',
            amountPrefix: isProfit ? '+' : '',
            description: fundT('fund.descSettlement')
          };
        case 'deposit':
          return {
            typeText: fundT('fund.typeTestDeposit'),
            icon: 'arrow-down',
            amountClass: 'deposit',
            amountPrefix: '+',
            description: fundT('fund.descTestDeposit')
          };
        case 'withdraw':
          return {
            typeText: fundT('fund.typeTestWithdraw'),
            icon: 'arrow-up',
            amountClass: 'withdraw',
            amountPrefix: '-',
            description: fundT('fund.descTestWithdraw')
          };
        default:
          return {
            typeText: record.amount > 0 ? fundT('fund.typeIncome') : fundT('fund.typeExpense'),
            icon: record.amount > 0 ? 'arrow-down' : 'arrow-up',
            amountClass: record.amount > 0 ? 'deposit' : 'withdraw',
            amountPrefix: record.amount > 0 ? '+' : '-',
            description: record.description || ''
          };
      }
    } else {
      switch (record.type) {
        case 'deposit':
          return {
            typeText: fundT('fund.typeDeposit'),
            icon: 'arrow-down',
            amountClass: 'deposit',
            amountPrefix: '+',
            description: fundT('fund.descDeposit')
          };
        case 'withdraw':
          return {
            typeText: fundT('fund.typeWithdraw'),
            icon: 'arrow-up',
            amountClass: 'withdraw',
            amountPrefix: '-',
            description: fundT('fund.descWithdraw')
          };
        default:
          return {
            typeText: record.type || (record.amount > 0 ? fundT('fund.typeIncome') : fundT('fund.typeExpense')),
            icon: record.amount > 0 ? 'arrow-down' : 'arrow-up',
            amountClass: record.amount > 0 ? 'deposit' : 'withdraw',
            amountPrefix: record.amount > 0 ? '+' : '-',
            description: record.reason || ''
          };
      }
    }
  }

  function getStatusText(record, isTestMode) {
    if (isTestMode) return fundT('fund.statusCompleted');
    if (record.status === 'completed') return fundT('fund.statusCompleted');
    if (record.status === 'processing') return fundT('fund.statusProcessing');
    if (record.status === 'pending') return fundT('fund.statusPending');
    if (record.status === 'failed') return fundT('fund.statusFailed');
    return record.status || fundT('fund.statusProcessing');
  }

  async function loadFundStats() {
    try {
      const isTestMode = window.ThemeManager ? window.ThemeManager.isTestMode : false;
      currentIsTestMode = isTestMode;
      const mode = isTestMode ? 'test' : 'live';
      const res = await fetch(`/api/v1/user/stats/fund?mode=${mode}`, { credentials: 'include' });
      const data = await res.json();
      
      if (data.success) {
        const currency = isTestMode ? 'tUSDT' : 'USDT';
        currentCurrency = currency;
        
        if (isTestMode) {
          if (DOM.totalDeposit) DOM.totalDeposit.innerHTML = '—';
          if (DOM.totalWithdraw) DOM.totalWithdraw.innerHTML = '—';
          if (DOM.netFund) {
            const testBalance = data.data?.test?.current_balance || 10000;
            DOM.netFund.innerHTML = testBalance.toFixed(2) + ' <span class="currency">' + currency + '</span>';
          }
        } else {
          if (DOM.totalDeposit) DOM.totalDeposit.innerHTML = (data.data?.real?.total_deposit || 0).toFixed(2) + ' <span class="currency">' + currency + '</span>';
          if (DOM.totalWithdraw) DOM.totalWithdraw.innerHTML = (data.data?.real?.total_withdraw || 0).toFixed(2) + ' <span class="currency">' + currency + '</span>';
          if (DOM.netFund) {
            const netFund = data.data?.real?.net_change || 0;
            DOM.netFund.innerHTML = netFund.toFixed(2) + ' <span class="currency">' + currency + '</span>';
          }
        }
      }
    } catch (err) {
      console.error('加载资金统计失败:', err);
    }
  }

  async function loadFundRecords(reset = true) {
    if (reset) {
      currentPage = 1;
      allRecords = [];
      showLoading();
    }

    try {
      const isTestMode = window.ThemeManager ? window.ThemeManager.isTestMode : false;
      currentIsTestMode = isTestMode;
      const currency = isTestMode ? 'tUSDT' : 'USDT';
      currentCurrency = currency;
      const mode = isTestMode ? 'test' : 'live';
      
      const url = `/api/v1/user/balance/logs?type=${currentType}&mode=${mode}&page=${currentPage}&limit=${pageSize}`;
      const res = await fetch(url, { credentials: 'include' });
      const data = await res.json();

      if (data.success) {
        let newRecords = data.data || [];
        
        if (isTestMode) {
          newRecords = newRecords.filter(record => 
            record.type === 'authorize' || record.type === 'settle' || 
            record.type === 'deposit' || record.type === 'withdraw'
          );
        } else {
          newRecords = newRecords.filter(record => 
            record.type === 'deposit' || record.type === 'withdraw'
          );
        }
        
        if (reset) {
          allRecords = newRecords;
        } else {
          allRecords = [...allRecords, ...newRecords];
        }

        hasMore = data.pagination?.pages > currentPage;
        renderRecords(currency, isTestMode);
        
        if (targetId) {
          setTimeout(() => scrollToTarget(targetId), 500);
        }
      } else {
        showEmpty();
      }
    } catch (err) {
      console.error('加载记录失败:', err);
      showEmpty();
    }
  }

  function renderRecords(currency, isTestMode) {
    if (allRecords.length === 0) {
      showEmpty();
      return;
    }

    let html = '';
    allRecords.forEach(record => {
      const displayInfo = getTypeDisplayInfo(record, isTestMode);
      const statusText = getStatusText(record, isTestMode);
      const amountAbs = Math.abs(record.amount).toFixed(2);
      const isTarget = record.id == targetId;
      
      html += `
        <div class="fund-item" data-id="${record.id}" ${isTarget ? 'data-target="true"' : ''} onclick="window.viewFundDetail(${record.id})">
          <div class="fund-icon ${displayInfo.amountClass}">
            <i class="fas fa-${displayInfo.icon}"></i>
          </div>
          <div class="fund-info">
            <div class="fund-type ${displayInfo.amountClass}">${displayInfo.typeText}</div>
            ${displayInfo.description ? `<div class="fund-desc"><i class="fas fa-info-circle"></i> ${escapeHtml(displayInfo.description)}</div>` : ''}
            <div class="fund-desc"><i class="fas fa-clock"></i> ${formatDate(record.created_at)}</div>
          </div>
          <div class="fund-right">
            <div class="fund-amount ${displayInfo.amountClass}">${displayInfo.amountPrefix}${amountAbs} ${escapeHtml(currency)}</div>
            <div class="fund-time">${escapeHtml(statusText)}</div>
          </div>
        </div>
      `;
    });
    
    DOM.fundList.innerHTML = html;
    DOM.fundList.style.display = 'block';
    DOM.loadingState.style.display = 'none';
    DOM.emptyState.style.display = 'none';
    DOM.loadMore.style.display = hasMore ? 'flex' : 'none';
  }

  function scrollToTarget(id) {
    const targetElement = document.querySelector(`.fund-item[data-id="${id}"]`);
    if (targetElement) {
      targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
      targetElement.classList.add('highlight');
      setTimeout(() => targetElement.classList.remove('highlight'), 2000);
    }
  }

  function showLoading() {
    if (DOM.loadingState) DOM.loadingState.style.display = 'flex';
    if (DOM.fundList) DOM.fundList.style.display = 'none';
    if (DOM.emptyState) DOM.emptyState.style.display = 'none';
    if (DOM.loadMore) DOM.loadMore.style.display = 'none';
  }

  function showEmpty() {
    if (DOM.loadingState) DOM.loadingState.style.display = 'none';
    if (DOM.fundList) DOM.fundList.style.display = 'none';
    if (DOM.emptyState) DOM.emptyState.style.display = 'flex';
    if (DOM.loadMore) DOM.loadMore.style.display = 'none';
  }

  function loadMore() {
    currentPage++;
    loadFundRecords(false);
  }

  function switchType(type) {
    currentType = type;
    DOM.tabBtns.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.type === type);
    });
    showLoading();
    loadFundRecords(true);
  }

  function bindEvents() {
    DOM.tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        switchType(btn.dataset.type);
      });
    });

    if (DOM.loadMoreBtn) {
      DOM.loadMoreBtn.addEventListener('click', loadMore);
    }
  }

  function initModeListener() {
    if (window.ThemeManager) {
      updateModeUI(window.ThemeManager.isTestMode);
      
      window.ThemeManager.addListener(async (state) => {
        console.log('🔄 资金明细：模式已切换', state);
        updateModeUI(state.isTestMode);
        await loadFundStats();
        await loadFundRecords(true);
      });
    } else {
      updateModeUI(true);
    }
  }

  window.viewFundDetail = function(id) {
    console.log('查看详情:', id);
  };

  async function init() {
    updateFundI18n();
    console.log('🚀 初始化资金明细页面...');
    initModeListener();
    await loadFundStats();
    await loadFundRecords(true);
    bindEvents();
    console.log('✅ 资金明细页面初始化完成');
  }
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
